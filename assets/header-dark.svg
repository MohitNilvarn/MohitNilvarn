<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Mohit Nilvarn</title>
  <desc id="desc">AI/ML engineer working across data engineering, machine learning and generative AI. Focused on end-to-end ML pipelines, big data with PySpark, LLM agents and RAG, anomaly detection at scale.</desc>
  <defs>
    <linearGradient id="edge-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".1" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".9" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade"><rect width="1200" height="300" fill="url(#edge-fade)"/></mask>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }

    .eyebrow { font-size: 14px; letter-spacing: 3px; fill: #c9974c; }
    .name { font-size: 76px; letter-spacing: -1px; fill: #f5efe4; }
    .lede { font-size: 23px; fill: #8b949e; }
    .accent { font-style: italic; fill: #4fa8a3; }
    .spacer { fill-opacity: 0; }
    .tag { font-size: 13px; letter-spacing: 1px; fill: #8b949e; }

    .fade-in { animation: fade-in 1.2s ease-out both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* Rotating focus area: each phrase holds for one share of the cycle */
    .phrase { opacity: 0; animation: phrase 12.8s ease-in-out infinite both; }
    @keyframes phrase {
      0% { opacity: 0; transform: translateY(8px); }
      3.0%, 22.0% { opacity: 1; transform: none; }
      25.0%, 100% { opacity: 0; transform: translateY(-8px); }
    }

    /* Signal draws in once, then the anomaly keeps a slow pulse */
    .signal { fill: none; stroke: #4fa8a3; stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0;
              animation: draw 3.2s cubic-bezier(.65, 0, .35, 1) .4s both; }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    .band { fill: #4fa8a3; fill-opacity: .1; animation: fade-in 2.4s ease-out .4s both; }
    .anomaly { animation: appear .6s ease-out 3.2s both; }
    @keyframes appear { from { opacity: 0; } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 3.2s ease-out 3.4s infinite both; }
    @keyframes ring { 0% { transform: scale(1); opacity: .7; } 70%, 100% { transform: scale(4); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <text class="mono eyebrow fade-in" x="2" y="58">AI/ML ENGINEER · DATA ENGINEERING &amp; GENERATIVE AI</text>
  <text class="serif name fade-in d1" x="0" y="140">Mohit Nilvarn</text>
  <g class="fade-in d2">
    <text class="sans lede" x="0" y="196" style="opacity:1">Focused on</text>
    <text class="sans lede phrase" x="0" y="196" style="animation-delay:0.0s;opacity:1"><tspan class="spacer">Focused on</tspan><tspan class="serif accent" dx="9">end-to-end ML pipelines</tspan></text>
    <text class="sans lede phrase" x="0" y="196" style="animation-delay:3.2s"><tspan class="spacer">Focused on</tspan><tspan class="serif accent" dx="9">big data with PySpark</tspan></text>
    <text class="sans lede phrase" x="0" y="196" style="animation-delay:6.4s"><tspan class="spacer">Focused on</tspan><tspan class="serif accent" dx="9">LLM agents and RAG</tspan></text>
    <text class="sans lede phrase" x="0" y="196" style="animation-delay:9.6s"><tspan class="spacer">Focused on</tspan><tspan class="serif accent" dx="9">anomaly detection at scale</tspan></text>
  </g>

